{% load static %}

<div id="signupModal" class="modal"{% if show_signup_modal %} data-show-modal="true"{% endif %}>
    <div class="modal-content">
        <span class="close-btn" onclick="closeSignupModal()">&times;</span>
        
        <h1 class="auth-title">Sign Up</h1>

        <div class="auth-container">
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <form method="post" action="{% url 'signup' %}">
                {% csrf_token %}

                <label>
                    Username
                    <input type="text" name="username" required>
                </label>

                <label>
                    Password
                    <input type="password" name="password" required>
                </label>

                <label>
                    Email
                    <input type="text" name="email" required>
                </label>

                <label>
                    Role
                    <select name="role">
                        <option value="user">User</option>
                        <option value="organizer">Organizer</option>
                    </select>
                </label>

                <button type="submit">Sign up</button>
            </form>

            {% if success %}
                <div class="success">{{ success }}</div>
            {% endif %}

            <p class="switch">
                Already have an account?
                <a href="#" class="switch-modal-link" data-target="signin">Sign in</a>
            </p>
        </div>
    </div>
</div>

<link rel="stylesheet" href="{% static 'css/auth/signup.css' %}">
<link href="https://fonts.googleapis.com/css2?family=Playwrite+PL:wght@100..400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="{% static 'js/auth/auth.js' %}"></script>
